name: Apple signing API diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/signing-check/request.md"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple API credentials and provision access without exposing keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: swift scripts/check_apple_signing.swift
