name: iOS simulator build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test offline input engine
        run: |
          swiftc -parse-as-library Shared/ZhuyinEngine.swift Shared/PhoneticLexicon.swift tests/EngineTests.swift -o /tmp/engine_tests
          /tmp/engine_tests
      - name: Optionally expand open-licensed word dictionary
        run: python3 scripts/build_lexicon.py || echo "Retaining offline seed dictionary"
      - name: Check expanded dictionary response time
        run: /tmp/engine_tests Keyboard/Resources/lexicon.tsv
      - name: Generate App Store icon
        run: swift scripts/generate_icon.swift
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned simulator app and keyboard extension
        run: |
          xcodebuild -project NineGridZhuyin.xcodeproj -scheme NineGridZhuyin -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Archive unsigned iPhone device build
        run: |
          set -euo pipefail
          xcodebuild \
            -project NineGridZhuyin.xcodeproj \
            -scheme NineGridZhuyin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NineGridZhuyin-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          APP="$RUNNER_TEMP/NineGridZhuyin-unsigned.xcarchive/Products/Applications/NineGridZhuyin.app"
          test -d "$APP"
          test -d "$APP/PlugIns/NineGridKeyboardExt.appex"
          echo "Unsigned iPhone archive contains host app and keyboard extension."
